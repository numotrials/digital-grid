[project]
name = "digital-grid"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.15.2",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.411",
    "ruff>=0.15.22",
    "vulture>=2.16",
]

[tool.pyright]
typeCheckingMode = "standard"
extraPaths = ["devices"]

[tool.uv.workspace]
members = [
    "simulator_sample",
]
